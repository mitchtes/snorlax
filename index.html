<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snorlax TCG Master Gallery</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #121212;
      color: #ffffff;
      margin: 0;
      padding: 20px;
    }
    h1 {
      text-align: center;
      margin-bottom: 8px;
    }
    p.subtitle {
      text-align: center;
      color: #888;
      margin-bottom: 24px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 16px;
      max-width: 1400px;
      margin: 0 auto;
    }
    .card {
      background: #1e1e1e;
      border-radius: 12px;
      padding: 12px;
      text-align: center;
      border: 1px solid #2a2a2a;
      transition: transform 0.2s ease, border-color 0.2s ease, opacity 0.2s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .card.owned {
      border-color: #2e7d32;
      background: #172418;
    }
    .card img {
      width: 100%;
      height: auto;
      border-radius: 8px;
      background: #2a2a2a;
      min-height: 240px;
      object-fit: cover;
    }
    .card-name {
      font-size: 14px;
      font-weight: 600;
      margin-top: 10px;
      color: #efefef;
    }
    .card-id {
      font-size: 12px;
      color: #aaa;
      margin-top: 4px;
    }
    .owned-label {
      margin-top: 10px;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      user-select: none;
      color: #ccc;
    }
    .owned-label input {
      accent-color: #4caf50;
      width: 16px;
      height: 16px;
      cursor: pointer;
    }
    .status {
      text-align: center;
      font-size: 18px;
      color: #aaa;
      grid-column: 1 / -1;
      padding: 40px;
    }
  </style>
</head>
<body>

  <h1>Snorlax Card Gallery</h1>
  <p class="subtitle">Fetching all visual card variations...</p>

  <div id="gallery" class="grid">
    <div class="status" id="status-text">Loading Snorlax cards from TCGDex...</div>
  </div>

  <script>
    // Load saved ownership states from local storage
    const ownedCards = JSON.parse(localStorage.getItem('snorlax_owned_cards') || '{}');

    function toggleOwned(cardId, isChecked, cardElement) {
      ownedCards[cardId] = isChecked;
      localStorage.setItem('snorlax_owned_cards', JSON.stringify(ownedCards));
      if (isChecked) {
        cardElement.classList.add('owned');
      } else {
        cardElement.classList.remove('owned');
      }
    }

    async function fetchSnorlaxCards() {
      const gallery = document.getElementById('gallery');
      const statusText = document.getElementById('status-text');

      try {
        const response = await fetch('https://api.tcgdex.net/v2/en/cards?name=Snorlax');
        if (!response.ok) throw new Error('API network response was not ok');
        
        const cards = await response.json();

        if (!cards || cards.length === 0) {
          statusText.innerText = 'No Snorlax cards found.';
          return;
        }

        statusText.remove();

        cards.forEach(card => {
          if (card.image) {
            const cardElement = document.createElement('div');
            const isOwned = !!ownedCards[card.id];
            cardElement.className = `card ${isOwned ? 'owned' : ''}`;

            // P-A-049 and special promo fixes
            const webpUrl = `${card.image}/high.webp`;
            const pngUrl = `${card.image}/high.png`;
            const fallbackUrl = `${card.image}.png`;

            cardElement.innerHTML = `
              <img src="${webpUrl}" 
                   alt="${card.name}" 
                   loading="lazy" 
                   onerror="if(this.src!=='${pngUrl}'){this.src='${pngUrl}';}else{this.src='${fallbackUrl}';}">
              <div class="card-name">${card.name}</div>
              <div class="card-id">${card.id}</div>
              <label class="owned-label">
                <input type="checkbox" ${isOwned ? 'checked' : ''} onchange="toggleOwned('${card.id}', this.checked, this.closest('.card'))">
                Owned
              </label>
            `;
            gallery.appendChild(cardElement);
          }
        });

      } catch (error) {
        console.error('Error fetching cards:', error);
        statusText.innerText = 'Failed to load card images. Check your internet connection or ad blocker settings.';
      }
    }

    fetchSnorlaxCards();
  </script>

</body>
</html>
