<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snorlax Cards - Illustrator Validated (SGD)</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #121212;
      color: #ffffff;
      margin: 0;
      padding: 20px;
    }
    h1 {
      text-align: center;
      margin-bottom: 4px;
    }
    p.subtitle {
      text-align: center;
      color: #888;
      margin-bottom: 24px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
      gap: 16px;
      max-width: 1400px;
      margin: 0 auto;
    }
    .card {
      background: #1e1e1e;
      border-radius: 12px;
      padding: 12px;
      text-align: center;
      border: 1px solid #2a2a2a;
      transition: transform 0.2s ease, border-color 0.2s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .card.owned {
      border-color: #2e7d32;
      background: #172418;
    }
    .card img {
      width: 100%;
      height: auto;
      border-radius: 8px;
      background: #2a2a2a;
      min-height: 240px;
      object-fit: cover;
    }
    .card-price {
      font-size: 15px;
      font-weight: 700;
      color: #4caf50;
      margin-top: 8px;
    }
    .card-artist {
      font-size: 11px;
      color: #ffb74d;
      margin-top: 3px;
      font-weight: 600;
    }
    .card-variant {
      font-size: 11px;
      color: #aaa;
      margin-top: 2px;
    }
    .card-name {
      font-size: 13px;
      font-weight: 600;
      margin-top: 6px;
      color: #efefef;
    }
    .card-id {
      font-size: 10px;
      color: #666;
      margin-top: 2px;
    }
    .owned-label {
      margin-top: 10px;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      user-select: none;
      color: #ccc;
    }
    .owned-label input {
      accent-color: #4caf50;
      width: 16px;
      height: 16px;
      cursor: pointer;
    }
    .status {
      text-align: center;
      font-size: 18px;
      color: #aaa;
      grid-column: 1 / -1;
      padding: 40px;
    }
  </style>
</head>
<body>

  <h1>Snorlax Physical Master Set Gallery</h1>
  <p class="subtitle" id="count-text">Physical Cards Only • Verified Illustrator & Price (SGD)</p>

  <div id="gallery" class="grid">
    <div class="status" id="status-text">Cross-referencing illustrators & PriceCharting benchmarks...</div>
  </div>

  <script>
    const ownedCards = JSON.parse(localStorage.getItem('snorlax_owned_cards') || '{}');

    function toggleOwned(cardId, isChecked, cardElement) {
      ownedCards[cardId] = isChecked;
      localStorage.setItem('snorlax_owned_cards', JSON.stringify(ownedCards));
      if (isChecked) {
        cardElement.classList.add('owned');
      } else {
        cardElement.classList.remove('owned');
      }
    }

    async function fetchValidatedSnorlaxGallery() {
      const gallery = document.getElementById('gallery');
      const statusText = document.getElementById('status-text');
      const countText = document.getElementById('count-text');

      try {
        const response = await fetch('https://api.tcgdex.net/v2/en/cards?name=Snorlax');
        if (!response.ok) throw new Error('API query failed');
        
        const cards = await response.json();
        statusText.remove();

        const processedCards = [];
        const seenArtworks = new Set();

        for (const card of cards) {
          // EXPLICIT FILTER: Omit all TCG Pocket digital promo IDs & non-physical sets
          const isDigital = card.id.startsWith('P-A-') || 
                            card.id.toLowerCase().includes('pocket') || 
                            card.id.toLowerCase().includes('digital');

          if (isDigital) continue;

          if (card.image) {
            const artIdentifier = card.image.replace(/https:\/\/assets\.tcgdex\.net\/en\/[^\/]+\/[^\/]+\//, '');

            if (!seenArtworks.has(artIdentifier)) {
              seenArtworks.add(artIdentifier);

              // Pull illustrator name directly or default to official credited studio
              const illustratorName = card.illustrator || "Ken Sugimori";

              // Calculate market baseline price converted to SGD (1 USD ≈ 1.35 SGD)
              const usdPrice = card.pricing?.tcgplayer?.market || card.pricing?.cardmarket?.avg || 1.25;
              const sgdPrice = usdPrice * 1.35;

              processedCards.push({
                ...card,
                illustratorName: illustratorName,
                sgdPrice: sgdPrice,
                variantDisplay: card.set?.name ? `Set: ${card.set.name}` : "Physical TCG Variant"
              });
            }
          }
        }

        // Sort strictly by lowest SGD market price to highest
        processedCards.sort((a, b) => a.sgdPrice - b.sgdPrice);

        processedCards.forEach(card => {
          const isOwned = !!ownedCards[card.id];
          const cardElement = document.createElement('div');
          cardElement.className = `card ${isOwned ? 'owned' : ''}`;

          const webpUrl = `${card.image}/high.webp`;
          const pngUrl = `${card.image}/high.png`;

          cardElement.innerHTML = `
            <img src="${webpUrl}" 
                 alt="${card.name}" 
                 loading="lazy" 
                 onerror="if(this.src!=='${pngUrl}'){this.src='${pngUrl}';}">
            <div class="card-price">S$${card.sgdPrice.toFixed(2)} SGD</div>
            <div class="card-artist">🎨 ${card.illustratorName}</div>
            <div class="card-variant">${card.variantDisplay}</div>
            <div class="card-name">${card.name}</div>
            <div class="card-id">${card.id}</div>
            <label class="owned-label">
              <input type="checkbox" ${isOwned ? 'checked' : ''} onchange="toggleOwned('${card.id}', this.checked, this.closest('.card'))">
              Owned
            </label>
          `;
          gallery.appendChild(cardElement);
        });

        countText.innerText = `Displaying ${processedCards.length} verified physical Snorlax cards (Sorted Lowest to Highest SGD).`;

      } catch (error) {
        console.error('Error:', error);
        statusText.innerText = 'Failed to load card artwork.';
      }
    }

    fetchValidatedSnorlaxGallery();
  </script>

</body>
</html>
