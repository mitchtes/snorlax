<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Snorlax Collector's Gallery & Price Tracker</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --accent-yellow: #f59e0b;
            --accent-green: #10b981;
            --accent-blue: #38bdf8;
            --border-color: #334155;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 12px;
        }

        header {
            text-align: center;
            max-width: 1000px;
            margin: 0 auto 20px auto;
            padding: 16px;
            background-color: var(--card-bg);
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }

        h1 {
            color: var(--accent-yellow);
            margin: 0 0 6px 0;
            font-size: 1.8rem;
        }

        p.subtitle {
            color: var(--text-sub);
            margin: 0 0 16px 0;
            font-size: 0.95rem;
        }

        .controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 12px;
        }

        input[type="text"], select, button {
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background-color: var(--bg-color);
            color: var(--text-main);
            font-size: 0.9rem;
            width: 100%;
            max-width: 260px;
        }

        button.btn-action {
            background-color: var(--border-color);
            color: var(--accent-blue);
            font-weight: 600;
            cursor: pointer;
            width: auto;
            max-width: none;
        }

        button.btn-action:hover {
            background-color: var(--accent-blue);
            color: #000;
        }

        .stats-bar {
            font-weight: 600;
            color: var(--accent-blue);
            font-size: 0.85rem;
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .stats-pill {
            background-color: rgba(56, 189, 248, 0.1);
            padding: 6px 12px;
            border-radius: 20px;
            border: 1px solid rgba(56, 189, 248, 0.3);
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
            max-width: 1600px;
            margin: 0 auto;
        }

        .card-item {
            background-color: var(--card-bg);
            border-radius: 12px;
            border: 1px solid var(--border-color);
            padding: 14px;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .card-item.is-first {
            border: 2px solid var(--accent-yellow);
        }

        .card-item.is-owned {
            border: 2px solid var(--accent-green);
        }

        .badge-first {
            position: absolute;
            top: 18px;
            right: 18px;
            background-color: var(--accent-yellow);
            color: #000;
            font-weight: bold;
            font-size: 0.7rem;
            padding: 3px 6px;
            border-radius: 4px;
            z-index: 2;
        }

        .badge-owned {
            position: absolute;
            top: 18px;
            left: 18px;
            background-color: var(--accent-green);
            color: #fff;
            font-weight: bold;
            font-size: 0.7rem;
            padding: 3px 6px;
            border-radius: 4px;
            z-index: 2;
        }

        .img-container {
            width: 100%;
            height: 320px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: rgba(0, 0, 0, 0.25);
            border-radius: 8px;
            margin-bottom: 12px;
            overflow: hidden;
        }

        .img-container img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .card-info {
            display: flex;
            flex-direction: column;
            gap: 6px;
            font-size: 0.85rem;
        }

        .card-title {
            font-weight: 700;
            font-size: 1.05rem;
        }

        .card-meta {
            color: var(--text-sub);
        }

        .price-badge-live {
            margin-top: 6px;
            padding: 8px;
            background-color: rgba(16, 185, 129, 0.15);
            border: 1px solid var(--accent-green);
            border-radius: 6px;
            color: #6ee7b7;
            font-weight: bold;
            font-size: 0.9rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .owner-control {
            margin-top: 8px;
            padding: 10px;
            background-color: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
            color: var(--accent-green);
            cursor: pointer;
            touch-action: manipulation;
        }

        .owner-control input[type="checkbox"] {
            width: 22px;
            height: 22px;
            accent-color: var(--accent-green);
        }

        .price-buttons {
            display: flex;
            gap: 4px;
            margin-top: 6px;
        }

        .price-btn {
            flex: 1;
            padding: 6px 2px;
            font-size: 0.7rem;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background-color: rgba(255, 255, 255, 0.05);
            color: var(--text-main);
            text-decoration: none;
            text-align: center;
            font-weight: 600;
        }

        .art-description {
            padding: 6px;
            background-color: rgba(255, 255, 255, 0.05);
            border-radius: 6px;
            font-size: 0.8rem;
            color: var(--accent-blue);
            font-style: italic;
        }
    </style>
</head>
<body>

<header>
    <h1>Snorlax Collector & API Pricing</h1>
    <p class="subtitle">Live market pricing, price sorting, and mobile touch checklist</p>
    
    <div class="controls">
        <input type="text" id="searchInput" placeholder="Search set, card #, description..." oninput="filterCards()">
        
        <select id="artFilter" onchange="filterCards()">
            <option value="all">All Cards (254)</option>
            <option value="unique-only">First Instance of Unique Art (77)</option>
            <option value="owned">Cards You Own</option>
            <option value="unowned">Cards You Don't Own</option>
            <option value="unique-needed">Unique Artworks Still Needed</option>
        </select>

        <select id="sortFilter" onchange="filterCards()">
            <option value="row-asc">Sort: Default Row Order</option>
            <option value="price-desc">Sort: Price (High to Low)</option>
            <option value="price-asc">Sort: Price (Low to High)</option>
        </select>

        <select id="langFilter" onchange="filterCards()">
            <option value="all">All Languages</option>
            <option value="Japanese">Japanese</option>
            <option value="English">English</option>
            <option value="Chinese">Chinese</option>
        </select>

        <button class="btn-action" onclick="exportData()">Export Backup</button>
        <button class="btn-action" onclick="fetchLivePrices()">Sync Live Prices</button>
    </div>

    <div class="stats-bar">
        <span class="stats-pill" id="totalCountPill">Showing: 254</span>
        <span class="stats-pill" id="ownedCountPill">Owned: 0 / 254</span>
        <span class="stats-pill" id="artProgressPill">Unique Art Owned: 0 / 77</span>
        <span class="stats-pill" id="valPill">Collection Value: $0.00</span>
    </div>
</header>

    ];

    // Local storage owned state & cached price storage
    let ownedMap = JSON.parse(localStorage.getItem('snorlax_owned_cards') || '{}');
    let priceCache = JSON.parse(localStorage.getItem('snorlax_prices') || '{}');

    // Unique art group indexing
    const firstSeenGroups = new Set();
    const groupFirstRowMap = {};

    rawCards.forEach(c => {
        if (!firstSeenGroups.has(c.groupId)) {
            firstSeenGroups.add(c.groupId);
            c.isFirstInstance = true;
            groupFirstRowMap[c.groupId] = c;
        } else {
            c.isFirstInstance = false;
        }

        c.isOwned = !!ownedMap[c.row];
        c.apiPrice = priceCache[c.row] || 0;
    });

    function buildImageUrl(card) {
        if (card.row === 2) return "https://www.pokellector.com/card_images/Jungle.JP/47.png";
        if (card.row === 3) return "https://www.pokellector.com/card_images/Unnumbered-Promos/Hungry-Snorlax.png";
        if (card.row === 4 || card.row === 5) return "https://www.pokellector.com/card_images/Vending-Sheet-1/34-Snorlax.png";
        if (card.row === 12) return "https://www.pokellector.com/card_images/Challenge-from-the-Darkness/73-Rockets-Snorlax.png";

        const cleanNum = card.number.split('/')[0].replace(/^0+/, '');
        const engSetMap = {
            "Jungle": "base2", "Base Set 2": "base4", "Gym Heroes": "gym1", "Legendary Collection": "base6",
            "Wizards Promos": "promo", "Skyridge": "ecard3", "EX FireRed & LeafGreen": "ex6",
            "EX Team Rocket Returns": "ex7", "EX Dragon Frontiers": "ex15", "Diamond & Pearl": "dp1",
            "Diamond & Pearl Promos": "dpp", "Rising Rivals": "dp8", "Call of Legends": "col1",
            "Boundaries Crossed": "bw7", "Plasma Storm": "bw8", "Kalos Starter Set": "xy0", "Flashfire": "xy2",
            "BREAKthrough": "xy8", "Generations": "g1", "Fates Collide": "xy10", "XY Promos": "xyp",
            "Sun & Moon Promos": "smp", "Team Up": "sm9", "Unbroken Bonds": "sm10", "Hidden Fates": "sma",
            "Sword & Shield": "swsh1", "Sword & Shield Promos": "swshp", "Rebel Clash": "swsh2",
            "Battle Academy 2020: Mewtwo Deck": "swsh1", "Vivid Voltage": "swsh4", "Chilling Reign": "swsh6",
            "Fusion Strike": "swsh8", "Lost Origin": "swsh11", "Lost Origin: Trainer Gallery": "swsh11tg",
            "Crown Zenith": "swsh12pt5", "Pokémon GO": "pgo", "151": "sv3pt5", "Scarlet & Violet Promos": "svp",
            "Paradox Rift": "sv4", "Paldean Fates": "sv4pt5", "Twilight Masquerade": "sv6", "Surging Sparks": "sv8",
            "Prismatic Evolutions": "sv8pt5", "Journey Together": "sv9", "Perfect Order": "sv10"
        };

        if (engSetMap[card.set]) {
            return `https://images.pokemontcg.io/${engSetMap[card.set]}/${cleanNum}_hires.png`;
        }
        return `https://images.pokemontcg.io/base2/11_hires.png`;
    }

    // Fetch prices automatically via Pokemon TCG API
    async function fetchLivePrices() {
        const btn = document.querySelector('button[onclick="fetchLivePrices()"]');
        btn.innerText = "Fetching Pricing...";

        try {
            const response = await fetch("https://api.pokemontcg.io/v2/cards?q=name:snorlax");
            const data = await response.json();

            if (data && data.data) {
                data.data.forEach(apiCard => {
                    const price = apiCard.tcgplayer?.prices?.holofoil?.market || 
                                 apiCard.tcgplayer?.prices?.normal?.market || 
                                 apiCard.tcgplayer?.prices?.reverseHolofoil?.market || 0;

                    if (price > 0) {
                        // Match with our internal cards
                        rawCards.forEach(c => {
                            if (c.name.toLowerCase() === apiCard.name.toLowerCase() && apiCard.number.includes(c.number.split('/')[0])) {
                                c.apiPrice = parseFloat(price.toFixed(2));
                                priceCache[c.row] = c.apiPrice;
                            }
                        });
                    }
                });

                localStorage.setItem('snorlax_prices', JSON.stringify(priceCache));
                alert("Updated market pricing for English card catalog!");
            }
        } catch (e) {
            console.log("Error fetching API pricing", e);
            alert("Pricing fetched for cached values.");
        }

        btn.innerText = "Sync Live Prices";
        updateStatsPill();
        filterCards();
    }

    function toggleOwned(row, checked) {
        ownedMap[row] = checked;
        localStorage.setItem('snorlax_owned_cards', JSON.stringify(ownedMap));
        
        const cardObj = rawCards.find(c => c.row === row);
        if (cardObj) cardObj.isOwned = checked;

        updateStatsPill();
        filterCards();
    }

    function exportData() {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(ownedMap));
        const downloadAnchor = document.createElement('a');
        downloadAnchor.setAttribute("href", dataStr);
        downloadAnchor.setAttribute("download", "snorlax_collection_backup.json");
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();
    }

    function updateStatsPill() {
        const totalOwned = rawCards.filter(c => c.isOwned).length;
        const ownedGroupIds = new Set(rawCards.filter(c => c.isOwned).map(c => c.groupId));
        
        let totalValue = 0;
        rawCards.forEach(c => {
            if (c.isOwned && c.apiPrice) totalValue += c.apiPrice;
        });

        document.getElementById('ownedCountPill').innerText = `Owned: ${totalOwned} / 254`;
        document.getElementById('artProgressPill').innerText = `Unique Art Owned: ${ownedGroupIds.size} / 77`;
        document.getElementById('valPill').innerText = `Collection Value: $${totalValue.toFixed(2)}`;
    }

    function renderGallery(cards) {
        const grid = document.getElementById('galleryGrid');
        grid.innerHTML = '';

        cards.forEach(card => {
            const cardEl = document.createElement('div');
            cardEl.className = `card-item ${card.isFirstInstance ? 'is-first' : ''} ${card.isOwned ? 'is-owned' : ''}`;

            const imgUrl = buildImageUrl(card);

            const queryParam = encodeURIComponent(`${card.name} ${card.set} ${card.number}`);
            const pricechartingUrl = `https://www.pricecharting.com/search-products?q=${queryParam}`;
            const ebayUrl = `https://www.ebay.com/sch/i.html?_nkw=${queryParam}+pokemon&_sop=12`;
            const collectrUrl = `https://app.getcollectr.com/search?q=${queryParam}`;

            cardEl.innerHTML = `
                ${card.isFirstInstance ? '<span class="badge-first">1st Unique Art</span>' : ''}
                ${card.isOwned ? '<span class="badge-owned">✓ Owned</span>' : ''}

                <div class="img-container">
                    <img src="${imgUrl}" alt="${card.name}" loading="lazy" onerror="this.onerror=null; this.parentNode.innerHTML='<div style=\\'padding:20px; text-align:center; color:var(--text-sub);\\'><strong style=\\'color:var(--accent-yellow);\\'>${card.name}</strong><br>${card.set}<br>#${card.number}</div>';">
                </div>

                <div class="card-info">
                    <div class="card-title">Row ${card.row}: ${card.name}</div>
                    <div class="card-meta"><strong>Set:</strong> ${card.set} (${card.number})</div>
                    <div class="card-meta"><strong>Variant:</strong> ${card.variant} | ${card.lang}</div>

                    ${card.apiPrice > 0 ? 
                        `<div class="price-badge-live"><span>TCGPlayer Market:</span> <span>$${card.apiPrice.toFixed(2)}</span></div>` : 
                        ''
                    }

                    <div class="art-description">🎨 ${card.artDesc}</div>

                    <label class="owner-control">
                        <input type="checkbox" ${card.isOwned ? 'checked' : ''} onchange="toggleOwned(${card.row}, this.checked)">
                        I Own This Card
                    </label>

                    <div class="price-buttons">
                        <a href="${pricechartingUrl}" target="_blank" class="price-btn">PriceCharting</a>
                        <a href="${ebayUrl}" target="_blank" class="price-btn">eBay Sold</a>
                        <a href="${collectrUrl}" target="_blank" class="price-btn">Collectr</a>
                    </div>
                </div>
            `;

            grid.appendChild(cardEl);
        });

        document.getElementById('totalCountPill').innerText = `Showing: ${cards.length}`;
    }

    function filterCards() {
        const search = document.getElementById('searchInput').value.toLowerCase();
        const artFilter = document.getElementById('artFilter').value;
        const sortFilter = document.getElementById('sortFilter').value;
        const langFilter = document.getElementById('langFilter').value;

        const ownedGroupIds = new Set(rawCards.filter(c => c.isOwned).map(c => c.groupId));

        let filtered = rawCards.filter(c => {
            const matchesSearch = c.name.toLowerCase().includes(search) || 
                                  c.set.toLowerCase().includes(search) || 
                                  c.number.toLowerCase().includes(search) || 
                                  c.artDesc.toLowerCase().includes(search);

            let matchesArt = true;
            if (artFilter === 'unique-only') matchesArt = c.isFirstInstance;
            else if (artFilter === 'owned') matchesArt = c.isOwned;
            else if (artFilter === 'unowned') matchesArt = !c.isOwned;
            else if (artFilter === 'unique-needed') matchesArt = c.isFirstInstance && !ownedGroupIds.has(c.groupId);

            const matchesLang = langFilter === 'all' || c.lang === langFilter;

            return matchesSearch && matchesArt && matchesLang;
        });

        // Price Sorter Logic
        if (sortFilter === 'price-desc') {
            filtered.sort((a, b) => (b.apiPrice || 0) - (a.apiPrice || 0));
        } else if (sortFilter === 'price-asc') {
            filtered.sort((a, b) => (a.apiPrice || 0) - (b.apiPrice || 0));
        } else {
            filtered.sort((a, b) => a.row - b.row);
        }

        renderGallery(filtered);
    }

    updateStatsPill();
    renderGallery(rawCards);
</script>
