    body {

      background-color: #121212;
      color: #ffffff;
      margin: 0;
      padding: 20px;
    }
    h1 {
      text-align: center;
      margin-bottom: 4px;
    }
    p.subtitle {
      text-align: center;
      color: #888;
      margin-bottom: 24px;
    }
    .controls {
      text-align: center;
      margin-bottom: 20px;
    }
    .btn {
      background: #2a2a2a;
      color: #fff;
      border: 1px solid #444;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
    }
    .btn:hover {
      background: #3a3a3a;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
      gap: 16px;
      max-width: 1400px;
      margin: 0 auto;
    }
    .card {
      background: #1e1e1e;
      border-radius: 12px;
      padding: 12px;
      text-align: center;
      border: 1px solid #2a2a2a;
      transition: transform 0.2s ease, border-color 0.2s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .card.owned {
      border-color: #2e7d32;
      background: #172418;
    }
    .card img {
      width: 100%;
      height: auto;
      border-radius: 8px;
      background: #2a2a2a;
      min-height: 240px;
      object-fit: cover;
    }
    .card-price {
      font-size: 15px;
      font-weight: 700;
      color: #4caf50;
      margin-top: 8px;
    }
    .card-artist {
      font-size: 11px;
      color: #ffb74d;
      margin-top: 3px;
      font-weight: 600;
    }
    .card-set {
      font-size: 11px;
      color: #aaa;
      margin-top: 2px;
    }
    .card-name {
      font-size: 13px;
      font-weight: 600;
      margin-top: 6px;
      color: #efefef;
    }
    .card-id {
      font-size: 10px;
      color: #666;
      margin-top: 2px;
    }
    .owned-label {
      margin-top: 10px;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      user-select: none;
      color: #ccc;
    }
    .owned-label input {
      accent-color: #4caf50;
      width: 16px;
      height: 16px;
      cursor: pointer;
    }
  </style>
</head>

    function toggleOwned(cardId, isChecked, cardElement) {
      ownedCards[cardId] = isChecked;
      localStorage.setItem('snorlax_owned_cards', JSON.stringify(ownedCards));
      if (isChecked) {
        cardElement.classList.add('owned');
      } else {
        cardElement.classList.remove('owned');
      }
    }

    function toggleHideOwned() {
      hideOwned = !hideOwned;
      renderGallery();
    }

    function renderGallery() {
      const gallery = document.getElementById('gallery');
      const countText = document.getElementById('count-text');
      gallery.innerHTML = '';

      MASTERSET_DATA.sort((a, b) => a.priceSGD - b.priceSGD);

      let visibleCount = 0;

      MASTERSET_DATA.forEach(card => {
        const isOwned = !!ownedCards[card.id];

        if (hideOwned && isOwned) return;

        visibleCount++;
        const cardElement = document.createElement('div');
        cardElement.className = `card ${isOwned ? 'owned' : ''}`;

        cardElement.innerHTML = `
          <img src="${card.img}" alt="${card.name}" loading="lazy">
          <div class="card-price">S$${card.priceSGD.toFixed(2)} SGD</div>
          <div class="card-artist">🎨 ${card.artist}</div>
          <div class="card-set">${card.set}</div>
          <div class="card-name">${card.name}</div>
          <div class="card-id">${card.id}</div>
          <label class="owned-label">
            <input type="checkbox" ${isOwned ? 'checked' : ''} onchange="toggleOwned('${card.id}', this.checked, this.closest('.card'))">
            Owned
          </label>
        `;
        gallery.appendChild(cardElement);
      });

      countText.innerText = `Displaying ${visibleCount} verified Snorlax cards (Sorted S$1.00 to S$1,080.00 SGD).`;
    }

    renderGallery();
  </script>
